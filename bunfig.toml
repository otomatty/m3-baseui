# Windows: Bun's default isolated linker symlinks break Node/esbuild resolution
# (MODULE_NOT_FOUND / "The file cannot be accessed by the system").
[install]
linker = "hoisted"

# happy-dom must register before @testing-library/react is imported, so its
# preload runs first, then the matcher/cleanup setup.
[test]
preload = ["./test/happy-dom.ts", "./test/setup.ts"]
